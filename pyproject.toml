[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-screener-engine"
version = "0.1.0"
description = "Modular stock screener engine for Indian equity markets"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{ name = "Quant Engineering Team" }]
dependencies = [
  "PyYAML>=6,<7",
]

[project.scripts]
stock-engine = "stock_screener_engine.interfaces.cli.main:main"

[project.optional-dependencies]
market = [
  "yfinance>=0.2,<1.3",
]
broker = [
  "kiteconnect>=5,<6",
  "breeze-connect>=1,<2",
]
documents = [
  "pypdf>=4,<7",
]
dev = [
  "pytest>=8,<9",
  "ruff>=0.8,<1",
  "mypy>=1.13,<2",
]
all = [
  "yfinance>=0.2,<1.3",
  "kiteconnect>=5,<6",
  "breeze-connect>=1,<2",
  "pypdf>=4,<7",
  "pytest>=8,<9",
  "ruff>=0.8,<1",
  "mypy>=1.13,<2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["stock_screener_engine*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
disable_error_code = ["import-untyped"]
